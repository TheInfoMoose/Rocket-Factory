[package]
name = "rocket-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Retro-futuristic TUI development planning workbench"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheInfoMoose/Rocket-Factory"
keywords = ["tui", "architecture", "planning", "ratatui", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".agents/**",
    ".github/**",
    ".orrery/**",
    ".phased/**",
    ".rocket/**",
    ".tracker/**",
    "docs/**",
    "scripts/**",
    "Rocket Factory.md",
    "STEPPED_IMPLEMENTATION_PLAN.md",
]

[lib]
name = "rocket_bench"
path = "src/lib.rs"

[[bin]]
name = "rktb"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ron = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
