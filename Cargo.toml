[package]
name = "rocket-factory"
version = "0.1.0"
edition = "2021"
description = "Retro-futuristic TUI development planning platform"

[lib]
name = "rocket_factory"
path = "src/lib.rs"

[[bin]]
name = "rf"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ron = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
