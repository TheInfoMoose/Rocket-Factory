name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: rktb
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: rktb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: rktb.exe
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Unix release archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          ASSET="rktb-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          STAGE="${RUNNER_TEMP}/stage"
          mkdir -p "$STAGE"
          cp "target/release/${BINARY}" README.md LICENSE "$STAGE/"
          tar -C "$STAGE" -czf "${ASSET}" "${BINARY}" README.md LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET}" > "${ASSET}.sha256"
          else
            shasum -a 256 "${ASSET}" > "${ASSET}.sha256"
          fi

      - name: Package Windows release archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "rktb-$env:GITHUB_REF_NAME-$env:TARGET.zip"
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/$env:BINARY", "README.md", "LICENSE" -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLowerInvariant()
          Set-Content -Path "$asset.sha256" -Value "$hash  $asset" -Encoding ascii

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            rktb-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            rktb-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
