name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Verify package
        run: cargo package --locked

  linux-git-build:
    name: Linux Git Build & Install
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --locked
          test -x target/release/rf

      - name: Install from git checkout
        run: |
          cargo install --git "file://${GITHUB_WORKSPACE}" --rev "$(git rev-parse HEAD)" --locked --root "${RUNNER_TEMP}/rf-install"

      - name: Smoke-test installed rf binary
        run: |
          RF_BIN="${RUNNER_TEMP}/rf-install/bin/rf"
          WS="${RUNNER_TEMP}/smoke-ws"
          mkdir -p "$WS"
          "$RF_BIN" --help
          "$RF_BIN" --path "$WS" init --name "smoke-test" --description "Linux CI smoke test"
          "$RF_BIN" --path "$WS" audit --strict
          "$RF_BIN" --path "$WS" export --format json
          "$RF_BIN" --path "$WS" export --format roadmap
