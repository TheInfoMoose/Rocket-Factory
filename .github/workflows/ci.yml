name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Check docs
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - name: Verify package
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked

  security-and-scripts:
    name: Security Audit & Script Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Security audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate shell scripts
        run: bash -n scripts/phased-step.sh scripts/neon-dispatch && shellcheck -S error scripts/phased-step.sh scripts/neon-dispatch

  linux-git-build:
    name: Linux Git Build & Install
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Build release binary
        run: |
          cargo build --release --locked
          test -x target/release/rktb

      - name: Install from git checkout
        run: |
          cargo install --git "file://${GITHUB_WORKSPACE}" --rev "$(git rev-parse HEAD)" --locked --root "${RUNNER_TEMP}/rktb-install"

      - name: Smoke-test installed rktb binary
        run: |
          RKTB_BIN="${RUNNER_TEMP}/rktb-install/bin/rktb"
          WS="${RUNNER_TEMP}/smoke-ws"
          mkdir -p "$WS"
          "$RKTB_BIN" --version
          "$RKTB_BIN" --help
          "$RKTB_BIN" --path "$WS" init --name "smoke-test" --description "Linux CI smoke test"
          "$RKTB_BIN" --path "$WS" audit --strict
          "$RKTB_BIN" --path "$WS" export --format json
          "$RKTB_BIN" --path "$WS" export --format roadmap
